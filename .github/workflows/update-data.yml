name: Refresh source-traceable country data
on:
  schedule:
    - cron: '17 3 * * 1' # each Monday UTC; publication frequency differs per source
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data dependencies
        run: python -m pip install requests pycountry
      - name: Refresh World Bank WDI
        run: python scripts/update_worldbank.py
      - name: Refresh UN Comtrade trade (last 3 available years)
        env:
          UN_COMTRADE_KEY: ${{ secrets.UN_COMTRADE_KEY }}
        run: |
          python scripts/update_trade.py --start $(($(date -u +%Y)-3)) --end $(($(date -u +%Y)-1)) || echo "Comtrade unavailable: existing verified snapshot is preserved"
      - name: Generate bundled browser data
        run: python scripts/build_bundle.py
      - name: Commit only validated data snapshots
        run: |
          git config user.name 'atlas-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/*.json data/bundle.js
          git diff --cached --quiet || (git commit -m "data: refresh published source snapshots" && git push)
